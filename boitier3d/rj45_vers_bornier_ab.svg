<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Arial, Helvetica, sans-serif">
<rect width="1100" height="720" fill="#fff"/>
<text x="550" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#111">Fiche RJ45 (câble coupé) → bornier A / B du XY-485</text>
<text x="290" y="70" text-anchor="middle" font-size="15" fill="#333">Fiche RJ45 vue de face : contacts vers toi, clip en bas</text>
<rect x="60" y="84" width="460" height="130" rx="10" fill="#e5e7eb" stroke="#444" stroke-width="3"/>
<rect x="230" y="214" width="120" height="26" rx="4" fill="#cbd5e1" stroke="#444" stroke-width="2"/>
<text x="290" y="233" text-anchor="middle" font-size="12" fill="#444">clip</text>
<rect x="90" y="100" width="20" height="78" rx="3" fill="#facc15" stroke="#555" stroke-width="2"/>
<text x="100" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">1</text>
<rect x="144" y="100" width="20" height="78" rx="3" fill="#facc15" stroke="#555" stroke-width="2"/>
<text x="154" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">2</text>
<rect x="198" y="100" width="20" height="78" rx="3" fill="#d6d3d1" stroke="#555" stroke-width="2"/>
<text x="208" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">3</text>
<rect x="252" y="100" width="20" height="78" rx="3" fill="#d6d3d1" stroke="#555" stroke-width="2"/>
<text x="262" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">4</text>
<rect x="306" y="100" width="20" height="78" rx="3" fill="#d6d3d1" stroke="#555" stroke-width="2"/>
<text x="316" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">5</text>
<rect x="360" y="100" width="20" height="78" rx="3" fill="#d6d3d1" stroke="#555" stroke-width="2"/>
<text x="370" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">6</text>
<rect x="414" y="100" width="20" height="78" rx="3" fill="#fca5a5" stroke="#555" stroke-width="2"/>
<text x="424" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">7</text>
<rect x="468" y="100" width="20" height="78" rx="3" fill="#fca5a5" stroke="#555" stroke-width="2"/>
<text x="478" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">8</text>
<text x="100" y="74" text-anchor="middle" font-size="12" fill="#555"></text>
<text x="100" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">A</text>
<text x="154" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f766e">B</text>
<line x1="415" y1="108" x2="433" y2="170" stroke="#b91c1c" stroke-width="3"/><line x1="433" y1="108" x2="415" y2="170" stroke="#b91c1c" stroke-width="3"/>
<line x1="469" y1="108" x2="487" y2="170" stroke="#b91c1c" stroke-width="3"/><line x1="487" y1="108" x2="469" y2="170" stroke="#b91c1c" stroke-width="3"/>
<text x="451.0" y="278" text-anchor="middle" font-size="12" fill="#b91c1c">7 et 8 : +5 V, isoler</text>
<text x="343.0" y="260" text-anchor="middle" font-size="12" fill="#555">5, 6 : GND</text>
<text x="235.0" y="260" text-anchor="middle" font-size="12" fill="#555">3, 4 : libres</text>
<rect x="360" y="500" width="400" height="120" rx="8" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
<circle cx="430" cy="550" r="28" fill="#e5e7eb" stroke="#1e3a8a" stroke-width="3"/>
<line x1="414" y1="550" x2="446" y2="550" stroke="#555" stroke-width="4"/>
<text x="430" y="608" text-anchor="middle" font-size="20" font-weight="bold" fill="#cbd5e1">Terre</text>
<circle cx="560" cy="550" r="28" fill="#e5e7eb" stroke="#1e3a8a" stroke-width="3"/>
<line x1="544" y1="550" x2="576" y2="550" stroke="#555" stroke-width="4"/>
<text x="560" y="608" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">B−</text>
<circle cx="690" cy="550" r="28" fill="#e5e7eb" stroke="#1e3a8a" stroke-width="3"/>
<line x1="674" y1="550" x2="706" y2="550" stroke="#555" stroke-width="4"/>
<text x="690" y="608" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">A+</text>
<text x="430" y="642" text-anchor="middle" font-size="12" fill="#6b7280">libre</text>
<text x="560" y="672" text-anchor="middle" font-size="13" fill="#555">Bornier du XY-485, module posé lisible : de gauche à droite Terre, B−, A+</text>
<path d="M100,214 C100,368.0 690,368.0 690,522" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<path d="M154,214 C154,368.0 560,368.0 560,522" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
<text x="722" y="470" font-size="15" font-weight="bold" fill="#1d4ed8">broche 1 (A) → A+</text>
<text x="300" y="490" font-size="15" font-weight="bold" fill="#0f766e">broche 2 (B) → B−</text>
<text x="30" y="560" font-size="13" fill="#555">Les deux fils se croisent sur le dessin :</text>
<text x="30" y="578" font-size="13" fill="#555">ils ne se touchent pas, ne les inverse pas.</text>
<text x="840" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Couleurs des fils (à vérifier à la continuité)</text>
<rect x="640" y="90" width="400" height="240" rx="6" fill="#f9fafb" stroke="#999"/>
<text x="670" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Broche</text>
<text x="800" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">T568B</text>
<text x="930" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">T568A</text>
<text x="670" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">1</text>
<text x="800" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">blanc-orange</text>
<text x="930" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">blanc-vert</text>
<text x="670" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">2</text>
<text x="800" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">orange</text>
<text x="930" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">vert</text>
<text x="670" y="186" text-anchor="middle" font-size="14" fill="#555">3</text>
<text x="800" y="186" text-anchor="middle" font-size="14" fill="#555">blanc-vert</text>
<text x="930" y="186" text-anchor="middle" font-size="14" fill="#555">blanc-orange</text>
<text x="670" y="210" text-anchor="middle" font-size="14" fill="#555">4</text>
<text x="800" y="210" text-anchor="middle" font-size="14" fill="#555">bleu</text>
<text x="930" y="210" text-anchor="middle" font-size="14" fill="#555">bleu</text>
<text x="670" y="234" text-anchor="middle" font-size="14" fill="#555">5</text>
<text x="800" y="234" text-anchor="middle" font-size="14" fill="#555">blanc-bleu</text>
<text x="930" y="234" text-anchor="middle" font-size="14" fill="#555">blanc-bleu</text>
<text x="670" y="258" text-anchor="middle" font-size="14" fill="#555">6</text>
<text x="800" y="258" text-anchor="middle" font-size="14" fill="#555">vert</text>
<text x="930" y="258" text-anchor="middle" font-size="14" fill="#555">orange</text>
<text x="670" y="282" text-anchor="middle" font-size="14" fill="#b91c1c">7</text>
<text x="800" y="282" text-anchor="middle" font-size="14" fill="#b91c1c">blanc-marron</text>
<text x="930" y="282" text-anchor="middle" font-size="14" fill="#b91c1c">blanc-marron</text>
<text x="670" y="306" text-anchor="middle" font-size="14" fill="#b91c1c">8</text>
<text x="800" y="306" text-anchor="middle" font-size="14" fill="#b91c1c">marron</text>
<text x="930" y="306" text-anchor="middle" font-size="14" fill="#b91c1c">marron</text>
<text x="840" y="358" text-anchor="middle" font-size="12" fill="#555">Ton câble est en T568B ou T568A : regarde la paire des broches 1 et 2.</text>
<text x="840" y="376" text-anchor="middle" font-size="12" fill="#555">Si rien ne répond au test : inverse A et B.</text>
</svg>