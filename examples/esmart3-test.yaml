##########################################################################
######   Lecture du régulateur eSmart3 40A via RS485 (composant esmart3)
##########################################################################
# Version de test : compilée avec succès sous ESPHome 2026.10.0 (ESP-IDF 5.5.6, ESP32), jamais flashée sur le matériel.
# Elle charge le composant depuis GitHub : à coller telle quelle dans l'add-on ESPHome Builder.
# Convention : tout ce qui se règle est dans `substitutions`, au début.
# Pour un Home Assistant sans secrets : remplacer les `!secret ...` par les valeurs en clair.

substitutions:
  esphome_name: "esmart3"
  friendly_name: "eSmart3"
  device_description: "Lecture du régulateur eSmart3 40A via RS485"
  prefix: "eSmart3"                 # préfixe du nom de toutes les entités
  log_level: "INFO"                 # VERY_VERBOSE pour voir les trames TX/RX

  # --- Réseau / sécurité ---
  api_encryption_key: !secret api_key
  ota_pswd: !secret ota_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # --- Composant ---
  component_source: "github://patmtp35/Esphome_Esmart3@main"
  component_refresh: "0s"           # re-télécharge à chaque compilation (mise au point)

  # --- Module XY-485 (direction automatique) sur ESP32 WROOM ---
  uart_tx_pin: "GPIO17"             # -> TXD du module (fil rouge)
  uart_rx_pin: "GPIO16"             # <- RXD du module (fil blanc)
  # flow_control_pin n'est PAS utilisé avec le XY-485 (voir plus bas, ligne commentée)

  # --- Réglages eSmart3 ---
  update_interval: "10s"            # mesures temps réel
  slow_update_every: "6"            # énergies + sortie charge : 1 lecture sur N
  address: "0"                      # 0 = diffusion (un seul régulateur)
  u32_word_order: "high_first"      # low_first si les kWh sont absurdes

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}

esp32:
  board: esp32dev

logger:
  level: ${log_level}

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_pswd}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

external_components:
  - source: ${component_source}
    components: [esmart3]
    refresh: ${component_refresh}

# Le port RJ45 du régulateur parle 9600 bauds, 8N1. Le composant refuse toute autre valeur.
uart:
  id: uart_esmart3
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 9600

esmart3:
  id: esmart3_hub
  uart_id: uart_esmart3
  update_interval: ${update_interval}
  slow_update_every: ${slow_update_every}
  address: ${address}
  u32_word_order: ${u32_word_order}
  # flow_control_pin: GPIO4  # seulement pour un module SANS direction automatique (DE/RE)

sensor:
  - platform: esmart3
    esmart3_id: esmart3_hub
    pv_voltage:
      name: "${prefix} Tension PV"
    battery_voltage:
      name: "${prefix} Tension batterie"
      # Le régulateur de skagmo affichait ~10 % trop bas : à vérifier au multimètre sur le vôtre.
      # filters:
      #   - calibrate_linear:
      #       - 12.00 -> 12.00   # (lecture eSmart3 -> valeur mesurée au multimètre)
      #       - 14.00 -> 14.00
    charging_current:
      name: "${prefix} Courant de charge"
    charging_power:
      name: "${prefix} Puissance de charge"
    load_voltage:
      name: "${prefix} Tension sortie charge"
    load_current:
      name: "${prefix} Courant sortie charge"
    load_power:
      name: "${prefix} Puissance sortie charge"
    battery_temperature:
      name: "${prefix} Température batterie"
    internal_temperature:
      name: "${prefix} Température interne"
    battery_level:
      name: "${prefix} SOC"      # calculé par le régulateur à partir de la tension seule
    charge_mode:
      name: "${prefix} Mode de charge (code)"
    fault_code:
      name: "${prefix} Code défaut"
    # Énergies (kWh) : compatibles tableau de bord Énergie de Home Assistant.
    energy_today:
      name: "${prefix} Production du jour"
    energy_month:
      name: "${prefix} Production du mois"
    energy_total:
      name: "${prefix} Production totale"
    load_energy_today:
      name: "${prefix} Conso sortie charge du jour"
    load_energy_month:
      name: "${prefix} Conso sortie charge du mois"
    load_energy_total:
      name: "${prefix} Conso sortie charge totale"

text_sensor:
  - platform: esmart3
    esmart3_id: esmart3_hub
    charge_mode:
      name: "${prefix} Mode de charge"
    faults:
      name: "${prefix} Défauts"
    load_mode:
      name: "${prefix} Mode sortie charge"

binary_sensor:
  - platform: esmart3
    esmart3_id: esmart3_hub
    load_on:
      name: "${prefix} Sortie charge active"
    fault:
      name: "${prefix} Défaut"

# ATTENTION — optionnel et NON testé sur matériel : cet interrupteur ÉCRIT dans la configuration
# du régulateur (mode de la sortie charge). Ne l'activez qu'après avoir lu le README.
# switch:
#   - platform: esmart3
#     esmart3_id: esmart3_hub
#     load:
#       name: "${prefix} Sortie charge"
